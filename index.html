<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monmouth County Mystery Investigator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Monmouth County Mystery Investigator</h1>
  <p>Use arrow keys (or WASD) to move the detective across Monmouth County. Reach locations of interest and press Space or Enter to investigate.</p>

  <div class="game-shell" id="gameShell">
    <div id="leafletMap" aria-label="Monmouth County investigation map"></div>
    <div id="hud">
      <div>Location: <span id="pos">0,0</span></div>
      <div>Site: <span id="landmark">None</span></div>
      <div>Action: <span id="action">Move with arrows</span></div>
    </div>
  </div>

  <div id="popup" class="hidden">
    <div id="popup-content">
      <button id="popup-close" title="Close">✕</button>
      <h3 id="popup-title"></h3>
      <p id="popup-text"></p>
      <div id="quiz-area" class="hidden">
        <p id="quiz-question" style="font-weight:700"></p>
        <div id="quiz-choices"></div>
        <p id="quiz-result" style="margin-top:10px;font-weight:700"></p>
      </div>
      <button id="start-quiz" type="button" class="hidden">Investigate Clue</button>
      <small>Press Space/Enter again to keep exploring.</small>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="game.js"></script>
</body>
</html>
